services:
  mariadb:
    container_name: mariadb
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network
    restart: always

wordpress:
  container_name: wordpress
  build:
    context: ./requirements/wordpress
  depends_on:
    - mariadb
  env_file:
    - .env
  ports:
    - "9090:9090"
  volumes:
    - wordpress_data:/var/www/html/wordpress
  networks:
    - inception_network
  restart: always

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: /home/epinaud/data/mariadb
      o: bind
  wordpress_data:
    driver: local
    driver_opts:

networks:
  inception_network:
    driver: bridge
